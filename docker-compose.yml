services:
  api:
    build: ./backend
    # Comes back after a VM reboot; a manual `docker compose stop` still keeps it stopped.
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Zone of the daily expiry job; the image ships tzdata for it.
      TZ: America/Argentina/Buenos_Aires
      # Swagger is off in Production; set it to true only in a restricted environment.
      Swagger__Habilitado: ${SWAGGER_HABILITADO:-false}
      ConnectionStrings__Default: Server=sqlserver;Database=Aseguradora;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      # Defaults are the Vite dev servers of the two React fronts; production sets the Pages domains.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_BACKOFFICE:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_PUBLIC:-http://localhost:5174}
      # Local compose creates the database on startup; production sets it to false and runs --migrar.
      Migraciones__AplicarAlIniciar: ${MIGRACIONES_APLICAR_AL_INICIAR:-true}
      Jwt__Key: ${JWT_KEY}
      # Initial administrator created on startup (US-F1-02). Leave empty to skip it.
      Seed__Administrador__Email: ${SEED_ADMINISTRADOR_EMAIL:-}
      Seed__Administrador__Password: ${SEED_ADMINISTRADOR_PASSWORD:-}
      # One key per external group, named after the provider it authenticates.
      ApiKeys__pasarela1: ${APIKEY_PASARELA1}
      ApiKeys__pasarela2: ${APIKEY_PASARELA2}
      Integraciones__Renaper__ApiKey: ${INTEGRACIONES_RENAPER_APIKEY}
      Integraciones__Dnrpa__ApiKey: ${INTEGRACIONES_DNRPA_APIKEY}
      Integraciones__Arca__ApiKey: ${INTEGRACIONES_ARCA_APIKEY}
      Integraciones__Pasarelas__pasarela1__ApiKey: ${INTEGRACIONES_PASARELA1_APIKEY}
      Integraciones__Pasarelas__pasarela2__ApiKey: ${INTEGRACIONES_PASARELA2_APIKEY}
    ports:
      # Loopback only: reachable from this machine, never from the network.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: curl -fsS http://localhost:8080/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      # Covers the first startup, when migrations create the database.
      start_period: 60s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-4096}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Optional: publishes the API through Cloudflare. Start it with `docker compose --profile tunnel up`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api

volumes:
  sqlserver-data:
