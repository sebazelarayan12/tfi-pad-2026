services:
  api:
    build: ./backend
    # Comes back after a VM reboot; a manual `docker compose stop` still keeps it stopped.
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Zone of the daily expiry job; the image ships tzdata for it.
      TZ: America/Argentina/Buenos_Aires
      # Swagger is off in Production; set it to true only in a restricted environment.
      Swagger__Habilitado: ${SWAGGER_HABILITADO:-false}
      ConnectionStrings__Default: Server=sqlserver;Database=Aseguradora;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      # Defaults are the Vite dev servers of the two React fronts; production sets the Pages domains.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_BACKOFFICE:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_PUBLIC:-http://localhost:5174}
      # Local compose creates the database on startup; production sets it to false and runs --migrar.
      Migraciones__AplicarAlIniciar: ${MIGRACIONES_APLICAR_AL_INICIAR:-true}
      Jwt__Key: ${JWT_KEY}
      Facturacion__Cuit: ${FACTURACION_CUIT:-}
      Facturacion__PuntoVenta: ${FACTURACION_PUNTO_VENTA:-0}
      Facturacion__IntervaloReintentoMinutos: ${FACTURACION_INTERVALO_REINTENTO_MINUTOS:-15}
      Facturacion__ReintentosHabilitados: ${FACTURACION_REINTENTOS_HABILITADOS:-true}
      # Initial administrator created on startup (US-F1-02). Leave empty to skip it.
      Seed__Administrador__Email: ${SEED_ADMINISTRADOR_EMAIL:-}
      Seed__Administrador__Password: ${SEED_ADMINISTRADOR_PASSWORD:-}
      # One key per external group, named after the provider it authenticates.
      ApiKeys__pasarela1: ${APIKEY_PASARELA1}
      ApiKeys__pasarela2: ${APIKEY_PASARELA2}
      # Mock or real per service. OpenRENAPER needs no key; FacturAR issues one per company.
      Integraciones__Renaper__UsarMock: ${INTEGRACIONES_RENAPER_USAR_MOCK:-true}
      Integraciones__Renaper__BaseUrl: ${INTEGRACIONES_RENAPER_BASEURL:-https://api-openrenaper.matiasagustinibanez.com}
      Integraciones__Renaper__RequiereApiKey: "false"
      Integraciones__Dnrpa__ApiKey: ${INTEGRACIONES_DNRPA_APIKEY}
      Integraciones__Arca__UsarMock: ${INTEGRACIONES_ARCA_USAR_MOCK:-true}
      Integraciones__Arca__BaseUrl: ${INTEGRACIONES_ARCA_BASEURL:-https://facturar-api-utn-frt-gncabkgzghh2gbf2.brazilsouth-01.azurewebsites.net}
      Integraciones__Arca__ApiKey: ${INTEGRACIONES_ARCA_APIKEY}
      Integraciones__Pasarelas__pasarela1__ApiKey: ${INTEGRACIONES_PASARELA1_APIKEY}
      # pasarela1 can be PADI (Tipo=Padi) instead of the contract 9.3 client; see docs/integraciones.md.
      Integraciones__Pasarelas__pasarela1__UsarMock: ${INTEGRACIONES_PASARELA1_USAR_MOCK:-true}
      Integraciones__Pasarelas__pasarela1__Tipo: ${INTEGRACIONES_PASARELA1_TIPO:-Contrato93}
      Integraciones__Pasarelas__pasarela1__BaseUrl: ${INTEGRACIONES_PASARELA1_BASEURL:-https://padi.runasp.net}
      Integraciones__Pasarelas__pasarela1__WebhookSecret: ${INTEGRACIONES_PASARELA1_WEBHOOK_SECRET:-}
      Integraciones__Pasarelas__pasarela2__ApiKey: ${INTEGRACIONES_PASARELA2_APIKEY}
      PagoFacil__CodigoEmpresa: ${PAGOFACIL_CODIGO_EMPRESA}
      # Online payment (CU15). The gateway calls back at Pagos__UrlBaseApi; production must set the public API URL.
      Pagos__UrlBaseApi: ${PAGOS_URL_BASE_API:-http://localhost:8080}
      Pagos__UrlRetornoExito: ${PAGOS_URL_RETORNO_EXITO:-http://localhost:5174/pago/exito}
      Pagos__UrlRetornoError: ${PAGOS_URL_RETORNO_ERROR:-http://localhost:5174/pago/error}
      Pagos__ReservaMinutos: ${PAGOS_RESERVA_MINUTOS:-60}
      Integraciones__Pasarelas__pasarela1__ConfirmarWebhook: ${PASARELA1_CONFIRMAR_WEBHOOK:-true}
      Integraciones__Pasarelas__pasarela2__ConfirmarWebhook: ${PASARELA2_CONFIRMAR_WEBHOOK:-true}
      # Networks allowed to send CF-Connecting-IP (RN20). Default is Docker's private range, where
      # cloudflared lives; without it every visitor would share one rate-limit counter.
      # `-` (not `:-`): the default applies only when REDES_CONFIABLES is unset, so setting it to an
      # empty string in .env really turns the header off.
      ForwardedHeaders__RedesConfiables__0: ${REDES_CONFIABLES-172.16.0.0/12}
    ports:
      # Loopback only: reachable from this machine, never from the network.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: curl -fsS http://localhost:8080/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      # Covers the first startup, when migrations create the database.
      start_period: 60s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-4096}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Optional: publishes the API through Cloudflare. Start it with `docker compose --profile tunnel up`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api

volumes:
  sqlserver-data:
