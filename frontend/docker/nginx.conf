server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fallback de SPA: una ruta profunda recargada devuelve index.html y la app resuelve la ruta.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre, así que se cachean un año.
    # `add_header` en un location reemplaza los del server: se repiten las cabeceras básicas.
    location ~* \.(js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # El CORS lo resuelve el back: acá no se agrega Access-Control-Allow-Origin.
}
