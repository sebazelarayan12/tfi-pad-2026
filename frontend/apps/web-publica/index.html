<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexa Seguros</title>
    <meta
      name="description"
      content="Consultá tu póliza, revisá tus cuotas y pagá online o en efectivo. Seguros para autos, motos y camionetas."
    />
    <link rel="canonical" href="https://nexaseguros.me/" />
    <!-- Vista previa al compartir el link (WhatsApp, Facebook, LinkedIn, X, Telegram). Las URLs deben ser absolutas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexa Seguros" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://nexaseguros.me/" />
    <meta property="og:title" content="Nexa Seguros" />
    <meta
      property="og:description"
      content="Consultá tu póliza, revisá tus cuotas y pagá online o en efectivo. Seguros para autos, motos y camionetas."
    />
    <meta property="og:image" content="https://nexaseguros.me/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Nexa Seguros sobre fondo azul" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexa Seguros" />
    <meta
      name="twitter:description"
      content="Consultá tu póliza, revisá tus cuotas y pagá online o en efectivo. Seguros para autos, motos y camionetas."
    />
    <meta name="twitter:image" content="https://nexaseguros.me/og-image.png" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Aplica el modo guardado (claro por defecto) antes de pintar, así no parpadea (src/marca/tema/). -->
    <script>
      (function () {
        var tema;
        try {
          tema = localStorage.getItem('nexa-tema');
        } catch (e) {}
        if (tema !== 'oscuro') tema = 'claro';
        document.documentElement.setAttribute('data-tema', tema);
        if (tema === 'oscuro') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1f4b');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
