<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexa Seguros</title>
    <meta
      name="description"
      content="Consultá tu póliza, revisá tus cuotas y pagá online o en efectivo. Seguros para autos, motos y camionetas."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Aplica el modo guardado (claro por defecto) antes de pintar, así no parpadea (src/marca/tema/). -->
    <script>
      (function () {
        var tema;
        try {
          tema = localStorage.getItem('nexa-tema');
        } catch (e) {}
        if (tema !== 'oscuro') tema = 'claro';
        document.documentElement.setAttribute('data-tema', tema);
        if (tema === 'oscuro') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1f4b');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
